<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OpenOctopus{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% set _path = request.url.path %}
<header class="topbar">
  <a class="brand" href="/">OpenOctopus<small>1688 → Ozon 搬运工作台</small></a>
  <nav class="mainnav" aria-label="主导航">
    <a class="navlink {% if _path == '/' or _path.startswith('/products') %}navlink-active{% endif %}"
       href="/" {% if _path == '/' or _path.startswith('/products') %}aria-current="page"{% endif %}>商品</a>
    <a class="navlink {% if _path.startswith('/dashboard') %}navlink-active{% endif %}"
       href="/dashboard" {% if _path.startswith('/dashboard') %}aria-current="page"{% endif %}>看板</a>
    <a class="navlink {% if _path.startswith('/promotions') %}navlink-active{% endif %}"
       href="/promotions" {% if _path.startswith('/promotions') %}aria-current="page"{% endif %}>促销</a>
    <a class="navlink {% if _path.startswith('/jobs') %}navlink-active{% endif %}"
       href="/jobs" {% if _path.startswith('/jobs') %}aria-current="page"{% endif %}>任务</a>
  </nav>
  <nav class="rightnav">{% block nav %}{% endblock %}</nav>
</header>
<main class="wrap">{% block content %}{% endblock %}</main>
</body>
</html>
