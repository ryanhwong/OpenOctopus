[project]
name = "openoctopus"
version = "0.1.0"
description = "1688 to Ozon product migration pipeline"
readme = "README.md"
authors = [
    { name = "ryanhwong", email = "414913832@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.78",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.3.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pywebview>=6.2.1",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
